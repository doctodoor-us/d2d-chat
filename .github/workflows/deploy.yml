name: Deploy DocToDoor AI Chat (Develop)

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Build and push Docker image (ARM64)
        run: |
          docker build \
            --platform linux/arm64 \
            -f Dockerfile.multi \
            --target api-build \
            -t ghcr.io/doctodoor-us/d2d-chat:latest \
            .
          docker push ghcr.io/doctodoor-us/d2d-chat:latest

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Deploy to server via SSH
        run: |
          ssh -o StrictHostKeyChecking=no hardik@129.158.245.245 \
            "cd /var/www/docker/d2d-ai/chat.doctodoor.com \
            && docker compose pull \
            && docker compose up -d"

      - name: Verify deployment
        run: |
          echo "Waiting for services to start..."
          sleep 30
          ssh -o StrictHostKeyChecking=no hardik@129.158.245.245 \
            "cd /var/www/docker/d2d-ai/chat.doctodoor.com \
            && docker compose ps \
            && echo 'Checking health endpoint on port 3080...' \
            && curl -f http://localhost:3080/health || (echo 'Health check failed, checking port 8000 as fallback...' && curl -f http://localhost:8000/health)"
